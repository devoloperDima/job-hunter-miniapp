<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Фильтры вакансий</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
  /* Цвета — из темы Telegram (telegram-web-app.js выставляет --tg-theme-*), запасные — для демо в браузере. */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #2481cc);
    --header: var(--tg-theme-section-header-text-color, #6d6d72);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --chip: color-mix(in srgb, var(--hint) 14%, transparent);
    --chip-on: color-mix(in srgb, var(--accent) 16%, transparent);
    --warn-bg: color-mix(in srgb, #f5a623 16%, transparent);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #000000; --card: #1c1c1e; --text: #ffffff; --hint: #8e8e93; --accent: #3e88f7; --link: #3e88f7;
      --header: #8e8e93;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: 12px 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto; overflow-x: hidden;
  }
  h1 { font-size: 22px; margin: 4px 0 2px; font-weight: 700; }
  .sub { color: var(--hint); font-size: 14px; margin: 0 0 14px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 10px; padding: 2px; margin-bottom: 16px;
          position: sticky; top: 8px; z-index: 2;
          background: color-mix(in srgb, var(--hint) 14%, var(--bg));
          box-shadow: 0 -8px 0 8px var(--bg), 0 8px 0 0 var(--bg); }
  .tabs button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px;
                 padding: 7px 4px; border-radius: 8px; cursor: pointer; font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .section-title { color: var(--header); font-size: 13px; text-transform: uppercase; letter-spacing: .02em;
                   margin: 18px 4px 6px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; }
  .card + .note, .note { color: var(--hint); font-size: 13px; margin: 6px 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid transparent; background: var(--chip); color: var(--text); font: inherit; font-size: 15px;
          padding: 7px 12px; border-radius: 18px; cursor: pointer; user-select: none; }
  .chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--accent); color: var(--link); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .grow { flex: 1; min-width: 0; }
  .row small { display: block; color: var(--hint); font-size: 13px; }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint); flex: none; display: grid;
           place-items: center; }
  .radio.on { border-color: var(--accent); }
  .radio.on::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--text); background: var(--chip); border: 0;
                               border-radius: 10px; padding: 10px 12px; outline: none; }
  input[type=text]:focus, textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
  textarea { min-height: 90px; resize: vertical; }
  .city-other { margin-top: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 14px;
         padding: 4px 6px 4px 10px; font-size: 14px; }
  .tag button { border: 0; background: transparent; color: var(--hint); font-size: 16px; cursor: pointer;
                width: 24px; height: 24px; line-height: 1; border-radius: 50%; }
  .add { display: flex; gap: 8px; }
  .add input { flex: 1; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600;
         background: var(--accent); color: var(--accent-text); cursor: pointer; text-align: center; }
  .btn.small { width: auto; padding: 10px 14px; }
  .btn.ghost { background: var(--chip); color: var(--link); }
  .btn:disabled { opacity: .5; cursor: default; }
  .soon { opacity: .75; }
  .badge { font-size: 12px; font-weight: 600; background: var(--chip); color: var(--hint); padding: 2px 8px;
           border-radius: 10px; margin-left: 6px; vertical-align: 2px; }
  .badge.accent { background: var(--chip-on); color: var(--link); }
  .warn { background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .group-title { display: flex; justify-content: space-between; align-items: baseline; color: var(--hint);
                 font-size: 13px; margin: 14px 0 8px; }
  .group-title:first-of-type { margin-top: 10px; }
  .link { border: 0; background: none; color: var(--link); font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
  .salary { display: flex; align-items: center; gap: 10px; }
  .salary input { flex: 1; }
  .salary span { color: var(--hint); }
  .toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--chip); position: relative; flex: none;
            transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                   background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(18px); }
  .empty { color: var(--hint); font-size: 14px; padding: 6px 0; }
  .steps { display: flex; gap: 6px; margin: 0 0 14px; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--chip); }
  .steps span.on { background: var(--accent); }
  .meter { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; margin: 10px 0 4px; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; color: var(--hint); }
  .center .big { font-size: 44px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--chip); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 9;
           background: color-mix(in srgb, var(--text) 88%, transparent); color: var(--bg); border-radius: 12px;
           padding: 12px 14px; font-size: 15px; text-align: center; transition: opacity .2s, transform .2s;
           opacity: 0; transform: translateY(8px); pointer-events: none; max-width: 608px; margin: 0 auto; }
  .toast.show { opacity: 1; transform: none; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
             background: var(--bg); border-top: 1px solid var(--sep); }
  .savebar .btn { max-width: 608px; margin: 0 auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const tg = window.Telegram?.WebApp;
// Открыто в Telegram? С кнопки на клавиатуре (только так работает sendData) Telegram не передаёт initData —
// узнаём его по платформе: вне Telegram telegram-web-app.js ставит platform «unknown».
const inTelegram = Boolean(tg && (tg.initData || (tg.platform && tg.platform !== "unknown")));
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
// Справочники (профессии как на hh, уровни, форматы) бот вшивает при публикации — jh miniapp-deploy.
// Запасной каталог — только чтобы файл открывался сам по себе.
const CATALOG = /*CATALOG*/{"groups":[{"title":"Разработка","items":[["backend","🐍 Python / backend"],["java","☕ Java"],["frontend","🖥 Frontend (JS / TS)"],["fullstack","🧩 Fullstack"],["go","🐹 Go"],["csharp","#️⃣ C# / .NET"],["php","🐘 PHP"],["cpp","⚙️ C / C++ / embedded"],["ios","🍏 iOS"],["android","🤖 Android"],["flutter","📱 Flutter / React Native"],["gamedev","🎮 GameDev"],["1c","🟡 1С"],["rust","🦀 Rust"],["ruby","💎 Ruby"]]},{"title":"Данные и ИИ","items":[["ds","🧠 Data Science"],["da","📊 Аналитика данных"],["de","🛠 Data Engineering"],["ml","🤖 ML / AI"]]},{"title":"Тестирование","items":[["qa","🧪 Тестировщик / QA"]]},{"title":"Инфраструктура и безопасность","items":[["devops","♾ DevOps / SRE"],["sysadmin","🖧 Системный администратор"],["network","🌐 Сетевой инженер"],["dba","🗄 Администратор баз данных"],["security","🛡 Информационная безопасность"],["support","🎧 Техподдержка"]]},{"title":"Аналитика","items":[["sysanalyst","📐 Системный аналитик"],["ba","📋 Бизнес-аналитик"]]},{"title":"Менеджмент","items":[["product","🚀 Менеджер продукта"],["em","🎯 Engineering Manager"],["pm","🗂 Руководитель проектов"]]},{"title":"Дизайн и контент","items":[["design","🎨 Дизайнер UX/UI"],["techwriter","✍️ Технический писатель"]]}],"grades":[["intern","🎓 Стажировка"],["junior","🌱 Junior"],["middle","🌿 Middle"],["senior","🌳 Senior"],["lead","🧭 Тимлид"]],"cities":["Москва","Санкт-Петербург"],"formats":[["remote","🏠 Удалённо"],["hybrid","🔀 Гибрид"],["office","🏢 В офисе"]],"limits":{"companies":25,"company_len":40,"words":15,"word_len":30,"salary":10000000}}/*END*/ || {
  groups: [{ title: "Разработка", items: [["backend", "🐍 Python / backend"]] }],
  grades: [["intern", "🎓 Стажировка"], ["junior", "🌱 Junior"], ["middle", "🌿 Middle"], ["senior", "🌳 Senior"], ["lead", "🧭 Тимлид"]],
  cities: ["Москва", "Санкт-Петербург"],
  formats: [["remote", "🏠 Удалённо"], ["hybrid", "🔀 Гибрид"], ["office", "🏢 В офисе"]],
  limits: { companies: 25, company_len: 40, words: 15, word_len: 30, salary: 10000000 },
};
const LIMITS = CATALOG.limits;
const KNOWN = new Set(CATALOG.groups.flatMap((g) => g.items.map(([code]) => code)));
// Статический режим (GitHub Pages): бот кладёт пользователя и его фильтры в адрес (?s=base64url JSON;
// #-часть занимает Telegram), сохранение уходит боту через sendData. Без ?s= — серверный режим с API /api/*.
const STATE = readState();
const STATIC = Boolean(STATE);
const MAX_SEND = 4096;  // лимит sendData, байт

if (inTelegram) {
  document.documentElement.classList.add("tg");
  tg.ready();
  tg.expand();
}

function normPrefs(p = {}) {
  return {
    directions: (p.directions || []).filter((d) => KNOWN.has(d)),
    grades: p.grades || [],
    city: p.city || "Москва",
    formats: p.formats?.length ? p.formats : p.office_ok ? ["remote", "hybrid", "office"] : ["remote"],
    salary_min: p.salary_min || null,
    only_salary: Boolean(p.only_salary),
    exclude_words: p.exclude_words || [],
    exclude_companies: p.exclude_companies || [],
    min_match: p.min_match || 0,
  };
}

function readState() {
  const raw = params.get("s");
  if (!raw || !/^[A-Za-z0-9_-]+$/.test(raw)) return null;
  try {
    const b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), (c) => c.charCodeAt(0));
    const s = JSON.parse(new TextDecoder().decode(bytes));
    return {
      user: { name: s.n, is_owner: Boolean(s.o), status: s.st, step: s.sp },
      prefs: s.p,
      queue: s.q,
      resume_step: Boolean(s.rs),  // после фильтров попросить резюме (beta.resumes)
      resume: s.rm ?? 0,  // 0 — резюме нет, 1 — есть (фильтр по совпадению), 2 — владелец / подстройка резюме
      limits: s.l ? { sent_today: s.l[0], daily: s.l[1] } : null,
      subscription: { plan: s.o ? "owner" : "beta", paid: false },
    };
  } catch (e) {
    return null;
  }
}

// ---------- API (серверный режим) ----------
async function api(path, options = {}) {
  if (DEMO && !inTelegram) return demoApi(path, options);
  const res = await fetch(path, {
    ...options,
    headers: { Authorization: "tma " + (tg?.initData || ""), ...(options.json ? { "Content-Type": "application/json" } : {}) },
    body: options.json ? JSON.stringify(options.json) : options.body,
  });
  const data = await res.json().catch(() => ({ error: "Сервер не ответил" }));
  if (!res.ok) throw Object.assign(new Error(data.error || "Ошибка"), { status: res.status, code: data.code });
  return data;
}

// Демо без Telegram: ?demo=1 (?demo=new — новичок, ?demo=owner — владелец) — только посмотреть вёрстку.
function demoApi(path, options) {
  const kind = params.get("demo") || "friend";
  window.__demo ??= {
    user: { name: "Аня", is_owner: kind === "owner", status: kind === "new" ? "onboarding" : "active", step: kind === "new" ? "directions" : "" },
    resume_step: false,
    resume: kind === "owner" ? 2 : kind === "new" ? 0 : 1,
    prefs: { directions: kind === "new" ? [] : ["backend", "frontend"], grades: ["intern", "junior"], city: "Казань",
             formats: ["remote"], salary_min: 60000, only_salary: false, exclude_words: ["senior"], exclude_companies: ["Рога и копыта"] },
    queue: kind === "new" ? null : 37,
    limits: kind === "owner" ? null : { daily: 20, sent_today: 7 },
    subscription: { plan: kind === "owner" ? "owner" : "beta", paid: false },
  };
  return new Promise((ok) => setTimeout(() => {
    if (path === "/api/prefs") Object.assign(window.__demo, { prefs: options.json, user: { ...window.__demo.user, step: window.__demo.user.status === "onboarding" ? "resume" : "" } });
    ok(structuredClone(window.__demo));
  }, 300));
}

// ---------- состояние ----------
let me = null;        // пользователь, его фильтры, очередь, лимиты
let draft = null;     // правки фильтров до сохранения
let tab = "filters";
let busy = false;
let otherCity = false;
let profQuery = "";

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sorted = (a) => [...a].sort();
const haptic = (kind = "select") => {
  const h = tg?.HapticFeedback; if (!inTelegram || !h) return;
  kind === "select" ? h.selectionChanged() : h.notificationOccurred(kind);
};

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 2600);
}

function comparable(p) {
  return JSON.stringify({ ...p, directions: sorted(p.directions), grades: sorted(p.grades), formats: sorted(p.formats),
                          salary_min: p.salary_min || null, city: p.city.trim() });
}
function dirty() { return draft && me && comparable(draft) !== comparable(me.prefs); }
function onboarding() { return me.user.status === "onboarding"; }

// ---------- отрисовка ----------
function render() {
  if (!me) return;
  const hello = me.user.name ? `Привет, ${esc(me.user.name.split(" ")[0])}!` : "Привет!";
  const resumeStep = onboarding() && me.user.step === "resume";
  const sub = !onboarding() ? (me.queue != null ? `В очереди на подборку: ${me.queue}` : "Фильтры вакансий")
    : !me.resume_step ? "Выбери, что искать, — и я сразу начну подбирать вакансии."
    : resumeStep ? "Фильтры сохранены. Шаг 2 из 2 — пришли резюме PDF в чат с ботом." : "Шаг 1 из 2 — что искать. Потом пришлёшь резюме в чат.";
  $("#app").innerHTML = `
    <h1>${hello}</h1>
    <p class="sub">${esc(sub)}</p>
    ${onboarding() && me.resume_step ? `<div class="steps"><span class="on"></span><span class="${resumeStep ? "on" : ""}"></span></div>` : ""}
    <div class="tabs" role="tablist" style="grid-template-columns: repeat(2, 1fr)">
      ${[["filters", "🎯 Фильтры"], ["plan", "💳 Подписка"]].map(([id, label]) =>
        `<button role="tab" data-tab="${id}" aria-selected="${tab === id}">${label}</button>`).join("")}
    </div>
    <div id="panel">${tab === "filters" ? filtersView() : planView()}</div>
    ${!inTelegram && tab === "filters" ? `<div class="savebar"><button class="btn" id="save" ${dirty() || onboarding() ? "" : "disabled"}>Сохранить</button></div>` : ""}
  `;
  applyProfQuery();
  updateSave();
}

function chips(list, selected, name) {
  return `<div class="chips">${list.map(([code, label]) =>
    `<button class="chip" data-toggle="${name}" data-value="${esc(code)}" aria-pressed="${selected.map(String).includes(String(code))}">${esc(label)}</button>`).join("")}</div>`;
}

function tags(list, kind) {
  return list.length ? `<div class="tags">${list.map((c, i) =>
    `<span class="tag">${esc(c)}<button aria-label="Убрать ${esc(c)}" data-remove="${kind}" data-index="${i}">×</button></span>`).join("")}</div>` : "";
}

function tagInput(kind, placeholder, maxLen) {
  return `<div class="add">
      <input type="text" id="add-${kind}" data-add="${kind}" maxlength="${maxLen}" placeholder="${esc(placeholder)}" enterkeyhint="done">
      <button class="btn small ghost" data-add-btn="${kind}">Добавить</button>
    </div>`;
}

function filtersView() {
  const p = draft, known = CATALOG.cities.includes(p.city), custom = !known || otherCity;
  const moscow = p.city.trim().toLowerCase() === "москва";
  const n = p.directions.length;
  return `
    <div class="section-title">Профессии <span class="badge ${n ? "accent" : ""}">${n ? `выбрано ${n}` : "не выбрано"}</span></div>
    <div class="card">
      <input type="text" id="prof-search" placeholder="Найти профессию: Java, тестировщик, DevOps…" value="${esc(profQuery)}" autocomplete="off">
      ${CATALOG.groups.map((g, gi) => {
        const all = g.items.every(([code]) => p.directions.includes(code));
        return `<div class="prof-group" data-group="${gi}">
          <div class="group-title"><span>${esc(g.title)}</span>
            ${g.items.length > 1 ? `<button class="link" data-group-all="${gi}">${all ? "снять все" : "выбрать все"}</button>` : ""}</div>
          ${chips(g.items, p.directions, "directions")}
        </div>`;
      }).join("")}
      <div class="empty" id="prof-empty" hidden>Ничего не нашлось — попробуй по-другому</div>
    </div>
    ${n ? `<p class="note"><button class="link" id="prof-clear">Сбросить профессии</button></p>` : ""}

    <div class="section-title">Уровень</div>
    <div class="card">${chips(CATALOG.grades, p.grades, "grades")}</div>
    <p class="note">Стажировка — без опыта, Junior — 1–3 года, Middle — 3–6 лет, Senior — от 6 лет, Тимлид — ведёт команду.</p>

    <div class="section-title">Город</div>
    <div class="card">
      <div class="chips">
        ${CATALOG.cities.map((c) => `<button class="chip" data-city="${esc(c)}" aria-pressed="${!custom && p.city === c}">${esc(c)}</button>`).join("")}
        <button class="chip" data-city="" aria-pressed="${custom}">Другой</button>
      </div>
      ${custom ? `<input type="text" class="city-other" id="city" maxlength="60" placeholder="Например, Казань" value="${esc(known ? "" : p.city)}" autocomplete="address-level2">` : ""}
    </div>

    <div class="section-title">Формат работы</div>
    <div class="card">${chips(CATALOG.formats, p.formats, "formats")}</div>
    ${!moscow && p.formats.some((f) => f !== "remote") ? `<p class="note">Офис и гибрид я пока ищу только в Москве; в других городах — удалёнка по всей России.</p>` : ""}

    <div class="section-title">Уровень дохода</div>
    <div class="card">
      <div class="salary"><span>от</span>
        <input type="text" id="salary" inputmode="numeric" maxlength="11" placeholder="не важно" value="${p.salary_min ? Number(p.salary_min).toLocaleString("ru-RU") : ""}">
        <span>₽ в месяц</span></div>
      <div class="row" data-only-salary style="margin-top:6px"><div class="grow">Только с указанной зарплатой
        <small>Без галочки вакансии без зарплаты тоже приходят</small></div><span class="toggle ${p.only_salary ? "on" : ""}"></span></div>
    </div>

    <div class="section-title">Исключить слова в названии</div>
    <div class="card">${tagInput("exclude_words", "Например: senior, продажи", LIMITS.word_len)}${tags(p.exclude_words, "exclude_words")}</div>
    <p class="note">Вакансии, в названии которых есть такое слово, не придут.</p>

    <div class="section-title">Не показывать компании</div>
    <div class="card">${tagInput("exclude_companies", "Название или его часть", LIMITS.company_len)}${tags(p.exclude_companies, "exclude_companies")}</div>
    <p class="note">«Сбер» уберёт и «ПАО Сбербанк», и «СберСтрахование».</p>

    ${resumeView()}
  `;
}

function resumeView() {
  if (me.resume === 2) return "";  // владелец: профиль в master.yaml, резюме и так подстраивается
  if (me.resume === 1) {
    return `
    <div class="section-title">Совпадение с резюме</div>
    <div class="card">${chips(MATCH_OPTIONS, [draft.min_match], "min_match")}</div>
    <p class="note">Доля требований вакансии, которые закрывает твоё резюме. Лучшие по совпадению — первыми в подборке.
      ${STATIC && !onboarding() ? `<button class="link" id="resume-chat">Обновить резюме</button>` : ""}</p>`;
  }
  return `
    <div class="section-title">Подбор по резюме <span class="badge">по желанию</span></div>
    <div class="card">
      <p style="margin:0 0 12px">Пришли резюме ссылкой на hh.ru или PDF-файлом — буду присылать вакансии, которые лучше всего к нему подходят, с процентом совпадения.</p>
      ${STATIC && !onboarding() ? `<button class="btn ghost" id="resume-chat">📄 Добавить резюме</button>`
        : `<p class="note" style="margin:0">Можно прислать в чат с ботом после настройки.</p>`}
    </div>`;
}

const MATCH_OPTIONS = [["0", "Любое"], ["30", "от 30%"], ["50", "от 50%"], ["70", "от 70%"]];

function planView() {
  const s = me.subscription, l = me.limits;
  const pct = l ? Math.min(100, Math.round((l.sent_today / l.daily) * 100)) : 0;
  return `
    <div class="section-title">Твой тариф</div>
    <div class="card">
      <div style="font-weight:600;font-size:17px">${s.plan === "owner" ? "👑 Владелец" : "🧪 Бета"}
        <span class="badge accent">${s.plan === "owner" ? "без лимитов" : l ? "бесплатно" : "бесплатно, без лимитов"}</span></div>
      ${l ? `
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${l.daily}" aria-valuenow="${l.sent_today}"><i style="width:${pct}%"></i></div>
        <small style="color:var(--hint)">Сегодня прислано ${l.sent_today} из ${l.daily} вакансий</small>` : ""}
    </div>
    <div class="section-title">Подписка <span class="badge">скоро</span></div>
    <div class="card soon">
      <p style="margin:0 0 12px">Скоро здесь можно будет оформить подписку и оплатить её прямо в Telegram.</p>
      <button class="btn" disabled>Оформить — скоро</button>
    </div>`;
}

// Поиск по профессиям — без перерисовки, чтобы поле не теряло фокус.
function applyProfQuery() {
  const q = profQuery.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".prof-group").forEach((group) => {
    let inGroup = 0;
    group.querySelectorAll(".chip").forEach((chip) => {
      const hit = !q || chip.textContent.toLowerCase().includes(q);
      chip.hidden = !hit;
      inGroup += hit;
    });
    group.hidden = !inGroup;
    const all = group.querySelector("[data-group-all]");
    if (all) all.hidden = Boolean(q);
    shown += inGroup;
  });
  const empty = $("#prof-empty");
  if (empty) empty.hidden = shown > 0;
}

function updateSave() {
  const save = $("#save");
  if (save) save.disabled = !(dirty() || onboarding());
  if (!inTelegram) return;
  const mb = tg.MainButton;
  if (tab === "filters" && (dirty() || (onboarding() && me.user.step !== "resume"))) {
    const text = !onboarding() ? "Сохранить фильтры" : me.resume_step ? "Дальше — резюме" : "Сохранить и начать";
    mb.setParams({ text, is_visible: true, is_active: true });
  } else {
    mb.hide();
  }
}

function validate() {
  if (!draft.directions.length) return "Выбери хотя бы одну профессию";
  if (!draft.grades.length) return "Выбери хотя бы один уровень";
  if (!draft.city.trim()) return "Укажи город";
  if (!draft.formats.length) return "Выбери хотя бы один формат работы";
  return "";
}

async function save() {
  if (busy) return;
  draft.city = draft.city.trim();
  const err = validate();
  if (err) { haptic("error"); return toast(err); }
  if (STATIC) {
    const text = JSON.stringify({ v: 2, action: "prefs", prefs: draft });
    if (new TextEncoder().encode(text).length > MAX_SEND) return toast("Слишком длинные списки исключений — убери несколько");
    if (!inTelegram) return toast("Открой приложение из бота — тогда сохранится");
    haptic("success");
    tg.sendData(text);  // Telegram закрывает приложение, бот отвечает в чате
    return;
  }
  busy = true;
  if (inTelegram) tg.MainButton.showProgress(false);
  try {
    const wasOnboarding = onboarding();
    me = await api("/api/prefs", { method: "POST", json: draft });
    me.prefs = normPrefs(me.prefs);
    draft = structuredClone(me.prefs);
    haptic("success");
    toast(wasOnboarding && me.resume_step ? "Фильтры сохранены — теперь пришли резюме в чат"
      : me.queue != null ? `Сохранено. В очереди: ${me.queue}` : "Сохранено");
  } catch (e) {
    haptic("error");
    toast(e.message);
  } finally {
    busy = false;
    if (inTelegram) tg.MainButton.hideProgress();
    render();
  }
}

function addTag(kind) {
  const input = $(`#add-${kind}`);
  const value = input.value.replace(/\s+/g, " ").trim();
  if (!value) return;
  const list = draft[kind], max = kind === "exclude_words" ? LIMITS.words : LIMITS.companies;
  if (list.length >= max) return toast(`Не больше ${max}`);
  if (!list.some((x) => x.toLowerCase() === value.toLowerCase())) list.push(value);
  haptic(); render();
  $(`#add-${kind}`)?.focus();
}

// ---------- события ----------
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, .row, [data-tab]");
  if (!t || !me) return;
  if (t.dataset.tab) { tab = t.dataset.tab; haptic(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.toggle === "min_match") { draft.min_match = Number(t.dataset.value); haptic(); return render(); }
  if (t.id === "resume-chat") {  // бот попросит резюме в чате; приложение закроется
    if (!inTelegram) return toast("Открой приложение из бота");
    haptic(); tg.sendData(JSON.stringify({ v: 2, action: "resume" })); return;
  }
  if (t.dataset.toggle) {
    const key = t.dataset.toggle, v = t.dataset.value, list = draft[key];
    draft[key] = list.includes(v) ? list.filter((x) => x !== v) : [...list, v];
    haptic();
    return render();  // поиск по профессиям переживает перерисовку: applyProfQuery
  }
  if (t.dataset.groupAll != null) {
    const codes = CATALOG.groups[Number(t.dataset.groupAll)].items.map(([code]) => code);
    const all = codes.every((c) => draft.directions.includes(c));
    draft.directions = all ? draft.directions.filter((c) => !codes.includes(c)) : [...new Set([...draft.directions, ...codes])];
    haptic(); return render();
  }
  if (t.id === "prof-clear") { draft.directions = []; haptic(); return render(); }
  if ("city" in t.dataset) {
    otherCity = !t.dataset.city;
    if (t.dataset.city) draft.city = t.dataset.city;
    else if (CATALOG.cities.includes(draft.city)) draft.city = "";
    haptic(); render();
    if (!t.dataset.city) $("#city")?.focus();
    return;
  }
  if ("onlySalary" in t.dataset) { draft.only_salary = !draft.only_salary; haptic(); return render(); }
  if (t.dataset.remove) { draft[t.dataset.remove].splice(Number(t.dataset.index), 1); haptic(); return render(); }
  if (t.dataset.addBtn) return addTag(t.dataset.addBtn);
  if (t.id === "save") return save();
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.dataset?.add) { ev.preventDefault(); addTag(ev.target.dataset.add); }
  if (ev.key === "Enter" && (ev.target.id === "salary" || ev.target.id === "city" || ev.target.id === "prof-search")) ev.target.blur();
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "city") draft.city = t.value;
  if (t.id === "prof-search") { profQuery = t.value; applyProfQuery(); }
  if (t.id === "salary") {
    const digits = t.value.replace(/\D/g, "").slice(0, 8);
    draft.salary_min = digits ? Math.min(Number(digits), LIMITS.salary) : null;
    t.value = digits ? Number(digits).toLocaleString("ru-RU") : "";
  }
  updateSave();
});
if (inTelegram) tg.MainButton.onClick(save);

// ---------- старт ----------
function fatal(icon, text) {
  $("#app").innerHTML = `<div class="center"><div><div class="big">${icon}</div><p>${esc(text)}</p></div></div>`;
  if (inTelegram) tg.MainButton.hide();
}

(async () => {
  if (!inTelegram && !DEMO && !STATIC) return fatal("📱", "Открой это приложение из чата с ботом в Telegram.");
  try {
    me = STATIC ? STATE : await api("/api/me");
    me.prefs = normPrefs(me.prefs);
    draft = structuredClone(me.prefs);
    otherCity = !CATALOG.cities.includes(draft.city);
    render();
  } catch (e) {
    fatal(e.code === "invite" ? "✉️" : e.code === "consent" ? "💬" : "😕", e.message);
  }
})();
</script>
</body>
</html>
